name: Cloudflare production SEO smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live Cloudflare-hosted site
        run: node scripts/verify-live-cloudflare.cjs
