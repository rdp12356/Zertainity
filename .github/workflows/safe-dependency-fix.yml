name: Safe dependency lockfile remediation

on:
  push:
    branches: [audit/security-handoff-fixes-2026-10]
    paths: ['.github/workflows/safe-dependency-fix.yml']

permissions:
  contents: write

jobs:
  update-compatible-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install existing dependencies
        run: npm ci
      - name: Update compatible vulnerable lockfile packages
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile updates found"
          else
            echo "Compatible dependency versions updated; validating"
          fi
      - name: Verify patched lockfile installs
        run: npm ci
      - name: Lint, test and build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder_not_for_network_use
        run: |
          npm run lint
          npm test -- --ci
          npm run build
      - name: Commit verified lockfile changes to draft branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): update compatible vulnerable locked dependencies"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/audit/security-handoff-fixes-2026-10
