name: Security and quality checks

on:
  pull_request:
    branches: [ui-revamp]
  push:
    branches: [ui-revamp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Security handoff regression checks
        run: node scripts/verify-security-handoff.cjs
      - name: Verify branded authentication and transactional emails
        run: node scripts/verify-email-templates.cjs
      - name: Validate Python renderer syntax
        run: python -m py_compile backend/main.py
      - name: Validate service worker JavaScript
        run: node --check public/sw.js
      - name: Validate generated sitemap and crawler policy
        run: node scripts/verify-seo.cjs
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder_not_for_network_use
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Block high-severity vulnerable dependencies
        run: node scripts/check-dependency-audit.cjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan full Git history for leaked secrets
        run: gitleaks git --redact --verbose .
