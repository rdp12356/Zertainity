<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C" />
      <stop offset="20%" stop-color="#FBF5B7" />
      <stop offset="40%" stop-color="#B38728" />
      <stop offset="60%" stop-color="#FBF5B7" />
      <stop offset="80%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap');
    .logo-text {
      font-family: 'Instrument Serif', 'Cinzel', 'Playfair Display', 'Georgia', serif;
      font-size: 92px;
      font-weight: 500;
      fill: url(#gold-gradient);
      filter: url(#subtle-shadow);
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <text x="50" y="48" class="logo-text">Z</text>
</svg>
